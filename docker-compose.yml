services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    volumes:
      # Persistencia real de los datos entre reinicios del contenedor
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta UNA sola vez, al crear el volumen por primera vez,
      # para crear la tabla "tasks" automáticamente (equivalente a tu schema.sql)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-app
    restart: unless-stopped
    environment:
      PORT: 3000
      # OJO: DB_HOST es "db" (el nombre del servicio), no "localhost".
      # Docker Compose crea una red interna donde los servicios se resuelven por nombre.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: todo_pass
      DB_NAME: todo_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
