services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
    volumes:
      # Persistencia real de los datos entre reinicios del contenedor
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta UNA sola vez, al crear el volumen por primera vez,
      # para crear la tabla "tasks" automáticamente (equivalente a tu schema.sql)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    # No exponemos el puerto 5432 al host porque ya hay PostgreSQL instalado en el sistema
    # El contenedor de la app se comunica con la db a través de la red interna de Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo_user} -d ${POSTGRES_DB:-todo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      # OJO: DB_HOST es "db" (el nombre del servicio), no "localhost".
      # Docker Compose crea una red interna donde los servicios se resuelven por nombre.
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
